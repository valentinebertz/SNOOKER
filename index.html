let tab='home',mode='classic',teamCount=2,teamDraft=[{name:'Team 1',players:''},{name:'Team 2',players:''},{name:'Team 3',players:''},{name:'Team 4',players:''}],entry='balls';let assignments=[[],[],[],[]];function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Speichern fehlgeschlagen: Speicher voll?')}}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',2800)}function html(s){document.getElementById('app').innerHTML=s}function nav(){document.getElementById('tabs').innerHTML=[['home','🏠','Start'],['play','<span class="snooker-seven" aria-label="Schwarze Snookerkugel, 7 Punkte"></span>','Spiel'],['history','📅','Historie'],['stats','📊','Statistik'],['rules','📖','Regeln']].map(([id,ic,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')" aria-current="${tab===id?'page':'false'}"><span class="nav-icon">${ic}</span>${label}</button>`).join('')}function go(t){tab=t;nav();render()}function render(){if(tab==='home')home();if(tab==='play')play();if(tab==='history')history();if(tab==='stats')stats();if(tab==='rules')rules()}function home(){html(`<h1>Snooker-Spiel</h1><div class="card"><h2>${state.active?'Laufendes Spiel':'Neues Spiel starten'}</h2>${state.active?`<p class="muted">${esc(state.active.teams.map(t=>t.name).join(' · '))}</p><button class="btn" onclick="go('play')">Spiel fortsetzen →</button>`:`<div class="field"><label>Spielart</label><select id="mode" onchange="mode=this.value;setupFields()"><option value="classic" ${mode==='classic'?'selected':''}>Klassisch – 2 Teams gegeneinander</option><option value="friends" ${mode==='friends'?'selected':''}>Freizeit – 2 bis 4 Teams</option></select></div><div id="setup"></div><button class="btn" onclick="startGame()"><span class="snooker-seven" aria-label="Schwarze Snookerkugel, 7 Punkte"></span> Spiel starten</button>`}</div><div class="card"><h2>👥 Spielerpool</h2><p class="muted">Namen einmal speichern. Beim nächsten Spiel Namen antippen und Team auswählen.</p><div class="row"><input id="new-player" class="grow" style="width:auto" maxlength="70" placeholder="Neuen Spielernamen eingeben" onkeydown="if(event.key==='Enter')addPlayer()"><button class="btn small" onclick="addPlayer()">+ Speichern</button></div><div id="pool-list"></div></div><div class="card"><h2>Letzte Ergebnisse</h2>${state.games.length?state.games.slice(0,3).map(g=>resultLine(g)).join(''):'<p class="muted">Noch keine Spiele gespeichert.</p>'}</div><div class="card"><h2>Deine Daten</h2><p class="muted">Die App speichert Spiele offline. Exportiere regelmäßig ein Backup, besonders vor einem Handywechsel.</p><div class="row"><button class="btn alt" onclick="backup()">⬇ Backup (JSON)</button><button class="btn alt" onclick="document.getElementById('import').click()">⬆ Backup importieren</button><input type="file" id="import" accept=".json,application/json" hidden onchange="importBackup(this)"><button class="btn alt" onclick="csv()">⬇ CSV für Excel</button></div></div>`);if(!state.active)setupFields();renderPool()}function setupFields(){let m=document.getElementById('mode');if(m)mode=m.value;let e=document.getElementById('setup');if(!e)return;e.innerHTML=`${mode==='friends'?`<div class="field"><label>Anzahl Mannschaften</label><select onchange="teamCount=Number(this.value);setupFields()">${[2,3,4].map(n=>`<option ${teamCount===n?'selected':''}>${n}</option>`).join('')}</select></div>`:''}${Array.from({length:mode==='classic'?2:teamCount},(_,i)=>`<div class="grid2"><div class="field"><label>Team ${i+1}</label><input id="team${i}" value="${esc(teamDraft[i].name)}" placeholder="Teamname" oninput="teamDraft[${i}].name=this.value"></div><div class="field"><label>Spieler in Team ${i+1}</label><div id="team-members-${i}">${teamMembers(i)}</div></div></div>`).join('')}<p class="muted">${mode==='classic'?'Offizielle Snooker-Zählung mit zwei Seiten.':'Freizeitmodus: Alle Teams sammeln reihum Punkte. Automatische Kugelreihenfolge wie im klassischen Modus.'}</p>`}function startGame(){if(state.active)return go('play');let n=mode==='classic'?2:teamCount;let teams=teamDraft.slice(0,n).map((t,i)=>({name:t.name.trim()||`Team ${i+1}`,players:assignments[i].join(', '),playerNames:[...assignments[i]],score:0,bestBreak:0}));state.active={id:Date.now(),mode,teams,turn:0,actions:[],started:new Date().toISOString(),breakPoints:0,reds:15,phase:'red',nextColor:2};save();go('play')}

function teamMembers(i){return assignments[i].length?assignments[i].map((n,j)=>`<span class="team-chip"><button type="button" class="member-switch" aria-label="${esc(n)}: Team wechseln" title="Team wechseln" onclick="askSwitchTeam(${i},${j})">👤 ${esc(n)} ⇄</button><button type="button" aria-label="${esc(n)} aus Team entfernen" title="Zurück in den Spielerpool" onclick="removeMember(${i},${j})">×</button></span>`).join(''):'<span class="muted">Noch niemand zugeteilt</span>'}
function renderPool(){const el=document.getElementById('pool-list');if(!el)return;const n=mode==='classic'?2:teamCount;el.innerHTML=state.playerPool.length?`<div class="pool-buttons">${state.playerPool.map((name,i)=>({name,i})).filter(({name})=>!assignments.some(team=>team.includes(name))).map(({name,i})=>`<span class="pool-item"><button class="pool-name" ${state.active?'disabled title="Während eines laufenden Spiels nicht zuweisbar"':''} onclick="askTeam(${i})">👤 ${esc(name)}</button><button type="button" class="pool-action" aria-label="${esc(name)} bearbeiten" title="Name bearbeiten" onclick="editPlayer(${i})">✎</button><button type="button" class="pool-action delete" aria-label="${esc(name)} entfernen" title="Name entfernen" onclick="deletePlayer(${i})">×</button></span>`).join('')}</div><p class="muted">Antippen → Team wählen. Zugewiesene Namen verschwinden aus der Auswahl und erscheinen oben im Team. Teamname antippen → Teamwechsel bestätigen. Mit ✎ bearbeiten, mit × aus dem Pool entfernen. Bereits gespeicherte Spielergebnisse bleiben unverändert.</p>`:'<p class="muted">Noch keine Spieler gespeichert.</p>';for(let i=0;i<n;i++){const target=document.getElementById('team-members-'+i);if(target)target.innerHTML=teamMembers(i)}}
function addPlayer(){let el=document.getElementById('new-player');if(!el)return;let name=cleanName(el.value);if(!name)return toast('Bitte einen Namen eingeben');let existing=state.playerPool.findIndex(x=>x.toLocaleLowerCase('de')===name.toLocaleLowerCase('de'));if(existing>=0){el.value='';renderPool();if(!state.active)askTeam(existing);return toast('Name bereits im Spielerpool')}addPoolSilently(name);save();el.value='';renderPool();toast(name+' gespeichert');if(!state.active)askTeam(state.playerPool.length-1)}
function askTeam(idx){if(state.active)return toast('Teamzuordnung nur vor Spielbeginn');const name=state.playerPool[idx];if(!name)return;const n=mode==='classic'?2:teamCount;const modal=document.getElementById('assign-modal');modal.className='modal-cover';modal.innerHTML=`<div class="modal-panel" role="dialog" aria-modal="true" aria-label="Team für ${esc(name)} wählen"><h2>👤 ${esc(name)}</h2><p class="muted">In welches Team soll ${esc(name)}?</p>${Array.from({length:n},(_,i)=>`<button class="btn alt" onclick="assignPlayer(${idx},${i})">${esc(teamDraft[i].name||'Team '+(i+1))}</button>`).join('')}<button class="btn alt" onclick="closeTeamDialog()">Abbrechen</button></div>`}
function closeTeamDialog(){const modal=document.getElementById('assign-modal');modal.className='hidden';modal.innerHTML=''}
function assignPlayer(idx,team){const name=state.playerPool[idx];if(!name)return;assignments.forEach(a=>{const j=a.findIndex(x=>x.toLocaleLowerCase('de')===name.toLocaleLowerCase('de'));if(j>=0)a.splice(j,1)});assignments[team].push(name);closeTeamDialog();renderPool();toast(name+' → '+(teamDraft[team].name||'Team '+(team+1)))}

function editPlayer(idx){
 const name=state.playerPool[idx];if(!name)return;
 const modal=document.getElementById('assign-modal');
 modal.className='modal-cover';
 modal.innerHTML=`<div class="modal-panel" role="dialog" aria-modal="true" aria-label="Spielername bearbeiten">
 <h2>✎ Spieler bearbeiten</h2><p class="muted">Bisheriger Name: <b>${esc(name)}</b></p>
 <div class="field"><label for="edit-player-name">Neuer Name</label><input id="edit-player-name" maxlength="70" value="${esc(name)}" onkeydown="if(event.key==='Enter')saveEditedPlayer(${idx})"></div>
 <p class="muted">Der Spielerpool und noch nicht gestartete Teamzuordnungen werden aktualisiert. Die Historie abgeschlossener Spiele bleibt unverändert.</p>
 <button class="btn" onclick="saveEditedPlayer(${idx})">Änderung speichern</button><button class="btn alt" onclick="closeTeamDialog()">Abbrechen</button></div>`;
 modal.querySelector('#edit-player-name').focus();
}
function saveEditedPlayer(idx){
 const previous=state.playerPool[idx];if(!previous)return closeTeamDialog();
 const name=cleanName(document.getElementById('edit-player-name')?.value);
 if(!name)return toast('Bitte einen Namen eingeben');
 if(state.playerPool.some((n,i)=>i!==idx&&n.toLocaleLowerCase('de')===name.toLocaleLowerCase('de')))return toast('Diesen Namen gibt es bereits');
 state.playerPool[idx]=name;
 assignments.forEach(team=>team.forEach((n,j)=>{if(n===previous)team[j]=name}));
 save();closeTeamDialog();renderPool();toast('Name geändert: '+name);
}
function deletePlayer(idx){
 const name=state.playerPool[idx];if(!name)return;
 const modal=document.getElementById('assign-modal');
 modal.className='modal-cover';
 modal.innerHTML=`<div class="modal-panel" role="dialog" aria-modal="true" aria-label="Spieler entfernen">
 <h2>🗑 Spieler entfernen</h2><p>Möchtest du <b>${esc(name)}</b> aus dem Spielerpool löschen?</p>
 <p class="muted">Der Name wird aus den noch nicht gestarteten Teams entfernt. Abgeschlossene Spiele und ihre damaligen Spielernamen bleiben in der Historie erhalten.</p>
 <button class="btn red" onclick="confirmDeletePlayer(${idx})">Ja, aus Spielerpool entfernen</button><button class="btn alt" onclick="closeTeamDialog()">Abbrechen</button></div>`;
}
function confirmDeletePlayer(idx){
 const name=state.playerPool[idx];if(!name)return closeTeamDialog();
 state.playerPool.splice(idx,1);
 assignments.forEach(team=>{for(let i=team.length-1;i>=0;i--)if(team[i]===name)team.splice(i,1)});
 save();closeTeamDialog();renderPool();toast(name+' aus dem Pool entfernt');
}
function askSwitchTeam(team,index){
 if(state.active)return toast('Teamwechsel nur vor Spielbeginn');
 const name=assignments[team]?.[index];if(!name)return;
 const modal=document.getElementById('assign-modal');modal.className='modal-cover';
 modal.innerHTML=`<div class="modal-panel" role="dialog" aria-modal="true" aria-label="Team wechseln?">
 <h2>⇄ Team wechseln?</h2><p>Soll <b>${esc(name)}</b> aus <b>${esc(teamDraft[team].name||'Team '+(team+1))}</b> in ein anderes Team wechseln?</p>
 <button class="btn" onclick="chooseSwitchTeam(${team},${index})">Ja</button>
 <button class="btn alt" onclick="closeTeamDialog()">Nein</button></div>`;
}
function chooseSwitchTeam(team,index){
 const name=assignments[team]?.[index];if(!name)return closeTeamDialog();
 const n=mode==='classic'?2:teamCount;
 const modal=document.getElementById('assign-modal');
 modal.innerHTML=`<div class="modal-panel" role="dialog" aria-modal="true" aria-label="Neues Team wählen">
 <h2>Neues Team für ${esc(name)}</h2><p class="muted">Wohin soll ${esc(name)} wechseln?</p>
 ${Array.from({length:n},(_,i)=>i===team?'':`<button class="btn alt" onclick="switchMember(${team},${index},${i})">${esc(teamDraft[i].name||'Team '+(i+1))}</button>`).join('')}
 <button class="btn alt" onclick="closeTeamDialog()">Abbrechen</button></div>`;
}
function switchMember(from,index,to){
 if(from===to||to<0||to>=(mode==='classic'?2:teamCount))return;
 const name=assignments[from]?.[index];if(!name)return closeTeamDialog();
 assignments[from].splice(index,1);assignments[to].push(name);
 closeTeamDialog();renderPool();toast(name+' → '+(teamDraft[to].name||'Team '+(to+1)));
}
function removeMember(team,index){assignments[team].splice(index,1);renderPool()}
function ensureGame(g){if(!Number.isInteger(g.reds)){g.reds=15;g.phase='red';g.nextColor=2;toast('Altes Spiel: Kugelstand wurde auf 15 Rot zurückgesetzt. Bitte prüfen.')}if(!g.phase)g.phase='red';if(!g.nextColor)g.nextColor=2}
function permitted(g,n){if(g.phase==='red')return n===1&&g.reds>0;if(g.phase==='color')return n>=2&&n<=7;if(g.phase==='final')return n===g.nextColor;return false}
function nextBallLabel(g){if(g.phase==='red')return 'ROT (1)';if(g.phase==='color')return 'BELIEBIGE FARBE (2–7)';if(g.phase==='final')return colors[g.nextColor-1]?.[0].toUpperCase()+' ('+g.nextColor+')';return 'SPIELENDE'}
function play(){let g=state.active;if(!g){html('<div class="card"><h2>Kein laufendes Spiel</h2><p class="muted">Lege zuerst Mannschaften an.</p><button class="btn" onclick="go(\'home\')">Neues Spiel</button></div>');return}ensureGame(g);html(`<div class="row" style="justify-content:space-between"><h1>Live-Spielstand</h1><span class="badge">${g.mode==='classic'?'Klassisch':'Freizeit'}</span></div><div class="grid2">${g.teams.map((t,i)=>`<div class="team ${g.turn===i?'current':''}" onclick="selectTurn(${i})"><div class="name">${esc(t.name)}</div><div class="score">${t.score}</div><div class="players">${esc(t.players)||'Keine Spielernamen'}</div>${g.turn===i?'<span class="badge">● Am Zug</span>':''}</div>`).join('')}</div><div class="card"><h2>Punkte erfassen</h2><div class="statusline"><b>Nächste Kugel: ${nextBallLabel(g)}</b><div class="ballcount">🔴 Noch ${g.reds} von 15 roten Kugeln · ${g.phase==='final'?'Schlussfarben':'Farben werden wieder aufgesetzt'}</div></div><p class="muted">Für <b>${esc(g.teams[g.turn].name)}</b> · Laufendes Break: ${g.breakPoints}</p><div class="row"><button class="btn ${entry==='balls'?'':'alt'} small" onclick="entry='balls';render()"><span class="snooker-seven" aria-label="Schwarze Snookerkugel, 7 Punkte"></span> Kugelfarben</button><button class="btn ${entry==='numbers'?'':'alt'} small" onclick="entry='numbers';render()">🔢 Zahlen</button></div>${entry==='balls'?`<div class="balls">${colors.map(([name,n,color])=>`<button class="ball" ${permitted(g,n)?'':'disabled'} onclick="addPoints(${n})"><span class="sphere" style="background:${color}">${n}</span><small>${name}</small></button>`).join('')}</div>`:`<div class="grid3" style="margin:16px 0">${[1,2,3,4,5,6,7].map(n=>`<button class="btn alt" ${permitted(g,n)?'':'disabled'} onclick="addPoints(${n})">+ ${n} · ${colors[n-1][0]}</button>`).join('')}</div>`}<div class="row"><button class="btn alt" onclick="undo()">↶ Rückgängig</button><button class="btn alt" onclick="nextTurn()">↪ Nächstes Team</button></div><details><summary>Foul / Strafpunkte</summary><p class="muted">Foulpunkte gehen an die Gegenseite (im Freizeitmodus an das nächste Team). Beim Teamwechsel beginnt der neue Spieler mit Rot, solange noch rote Kugeln liegen. Nach der letzten Roten beginnt bei einem Wechsel die Schlussphase.</p><div class="row">${[4,5,6,7].map(n=>`<button class="btn alt small" onclick="foul(${n})">+${n} Foul</button>`).join('')}</div></details><div class="statusline dangerline"><b>Hausregel: Schwarz vorzeitig versenkt</b><p class="muted">Nur antippen, wenn Schwarz regelwidrig vorzeitig fällt. Normales Schwarz nach Rot über die Kugeltaste zählen.</p><button class="btn red" onclick="earlyBlack()">⚫ Schwarz vorzeitig – Spiel beenden</button></div></div><div class="card"><h2>Spielaktionen</h2><p class="muted">${g.actions.length?g.actions.slice(-5).reverse().map(a=>`${esc(g.teams[a.team].name)}: ${a.kind==='turn'?'Teamwechsel':(a.kind==='foul'?'Foul +':'+')+a.points}`).join(' · '):'Noch keine Punkte eingetragen.'}</p><div class="row"><button class="btn" onclick="finish()">🏆 Spiel beenden</button><button class="btn red small" onclick="discard()">Spiel verwerfen</button></div></div>`)}
function snapshot(g){return {turn:g.turn,breakPoints:g.breakPoints,reds:g.reds,phase:g.phase,nextColor:g.nextColor,best:g.teams.map(t=>t.bestBreak)}}
function changeTurn(g,i){
 if(i===g.turn)return false;
 const before=snapshot(g);
 // Jeder neue Spieler beginnt mit Rot, solange noch rote Kugeln vorhanden sind.
 // Nach der letzten Roten beginnt die Schlussphase, falls die letzte Farbchance ausgelassen wurde.
 if(g.reds>0)g.phase='red';
 else if(g.phase==='color'){g.phase='final';g.nextColor=2;}
 g.turn=i;g.breakPoints=0;
 g.actions.push({kind:'turn',team:i,points:0,before});
 return true;
}
function selectTurn(i){let g=state.active;if(!g)return;ensureGame(g);if(changeTurn(g,i)){save();render();toast('Team gewechselt: '+nextBallLabel(g))}}

function addPoints(n){let g=state.active;if(!g)return;ensureGame(g);if(!permitted(g,n))return toast('Diese Kugel ist gerade nicht erlaubt');let before=snapshot(g),i=g.turn;g.teams[i].score+=n;g.breakPoints+=n;g.teams[i].bestBreak=Math.max(g.teams[i].bestBreak,g.breakPoints);if(g.phase==='red'){g.reds--;g.phase='color'}else if(g.phase==='color'){g.phase=g.reds===0?'final':'red';g.nextColor=2}else if(g.phase==='final'){g.nextColor++;if(g.nextColor>7)g.phase='done'}g.actions.push({kind:'pot',team:i,points:n,before});save();if(g.phase==='done'){completeGame('Alle Schlussfarben versenkt');return}render()}
function foul(n){let g=state.active;if(!g)return;let before=snapshot(g),i=g.turn,target=(i+1)%g.teams.length;g.teams[target].score+=n;g.actions.push({kind:'foul',team:target,points:n,before});g.breakPoints=0;save();render();toast(`${n} Strafpunkte für ${g.teams[target].name}`)}
function nextTurn(){let g=state.active;if(!g)return;ensureGame(g);if(changeTurn(g,(g.turn+1)%g.teams.length)){save();render()}}
function undo(){let g=state.active;if(!g||!g.actions.length)return toast('Keine Aktion zum Rückgängigmachen');let a=g.actions.pop();if(a.kind!=='turn')g.teams[a.team].score-=a.points;if(a.before){g.turn=a.before.turn;g.breakPoints=a.before.breakPoints;g.reds=a.before.reds;g.phase=a.before.phase;g.nextColor=a.before.nextColor;g.teams.forEach((t,i)=>t.bestBreak=a.before.best[i]||0)}else{g.turn=a.kind==='foul'?(a.team-1+g.teams.length)%g.teams.length:a.team;g.breakPoints=a.prevBreak||0}save();render()}
function beerMug(side){

function closeCheers(){const modal=document.getElementById('cheers-modal');modal.className='hidden';modal.innerHTML=''}
function showCheers(g){
 const modal=document.getElementById('cheers-modal');
 modal.className='cheers-cover';
 modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label','Spiel beendet – Prost');
 modal.innerHTML=`<div class="cheers-panel"><div class="cheers-heading">🍻 PROST! 🍻</div><p class="cheers-sub">Das Spiel ist beendet!</p>
 <div class="cheers-stage">${beerMug('left')}${beerMug('right')}<span class="cheers-splash">💦</span><span class="cheers-splash s2">🍺</span><span class="cheers-splash s3">✨</span></div>
 <div class="cheers-winner">🏆 ${g.winners.length===1?'Gewinner: '+esc(g.winners[0]):'Unentschieden!'}</div>
 <div class="cheers-score">${g.teams.map(t=>`<div class="cheers-team"><span>${esc(t.name)}</span><strong>${t.score}</strong><span>Punkte</span></div>`).join('')}</div>
 <p class="cheers-reason">${esc(g.endReason||'Spiel beendet')} · ${formatTime(g.ended)}</p>
 <button class="btn cheers-close" onclick="closeCheers()">🎉 Ergebnis ansehen</button></div>`;

}
function completeGame(reason){let g=state.active;if(!g)return;let max=Math.max(...g.teams.map(t=>t.score));g.winners=g.teams.filter(t=>t.score===max).map(t=>t.name);g.ended=new Date().toISOString();g.endReason=reason;state.games.unshift(g);state.active=null;save();go('history');showCheers(g)}
function earlyBlack(){let g=state.active;if(!g)return;if(!confirm('Schwarz vorzeitig versenkt? Das Spiel wird SOFORT beendet und die bisherigen Punkte werden gewertet.'))return;completeGame('Schwarz vorzeitig versenkt (Hausregel)')}
function finish(){if(!state.active)return;if(!confirm('Spiel beenden und Ergebnis in der Historie speichern?'))return;completeGame('Manuell beendet')}
function discard(){if(confirm('Laufendes Spiel wirklich löschen?')){state.active=null;save();go('home')}}
function formatTime(value){if(!value)return 'Nicht gespeichert';const d=new Date(value);return Number.isNaN(d.getTime())?'Nicht gespeichert':d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' Uhr'}function lastPlayed(){const dated=state.games.filter(g=>g.ended||g.started).sort((a,b)=>new Date(b.ended||b.started)-new Date(a.ended||a.started));return dated[0]||null}function resultLine(g){return `<div class="history"><div><b>${esc(g.teams.map(t=>t.name).join(' · '))}</b><div class="muted">👥 ${g.teams.map((t,i)=>`<b>${esc(t.name)}:</b> ${esc((Array.isArray(t.playerNames)?t.playerNames.join(', '):t.players)||'Keine Namen erfasst')}`).join(' · ')}</div><div class="muted">🕒 Beginn: <b>${formatTime(g.started)}</b></div><div class="muted">🏁 Ende: <b>${formatTime(g.ended)}</b></div><div class="muted">${g.mode==='classic'?'Klassisch':'Freizeit'}${g.endReason?' · '+esc(g.endReason):''}</div><div class="winner">🏆 ${esc((g.winners||[]).join(' & ')||'Unentschieden')}</div></div><div style="font-weight:850;white-space:nowrap">${g.teams.map(t=>t.score).join(' : ')}</div></div>`}function history(){let last=lastPlayed();let ordered=[...state.games].sort((a,b)=>new Date(b.ended||b.started||0)-new Date(a.ended||a.started||0));html(`<h1>Spielhistorie</h1><div class="card"><h2>🕒 Zuletzt gespielt</h2>${last?`<div class="statsnum" style="font-size:23px">${formatTime(last.ended||last.started)}</div><p class="muted">${esc(last.teams.map(t=>t.name).join(' · '))}</p>`:'<p class="muted">Noch kein abgeschlossenes Spiel vorhanden.</p>'}</div><div class="card"><h2>Alle Spiele</h2>${ordered.length?ordered.map(g=>`<div>${resultLine(g)}<button class="btn alt small history-delete" onclick="deleteHistoryGame(${state.games.indexOf(g)})">🗑 Dieses Spiel löschen</button></div>`).join(''):'<p class="muted">Hier erscheinen eure abgeschlossenen Spiele mit Beginn und Ende (Datum und Uhrzeit).</p>'}</div><div class="row"><button class="btn alt" onclick="csv()">CSV exportieren</button><button class="btn alt" onclick="backup()">Backup exportieren</button><button class="btn red" onclick="clearHistory()">🗑 Gesamte Historie löschen</button></div>`)}function deleteHistoryGame(i){
 const g=state.games[i];if(!g)return;
 if(!confirm('Dieses Spielergebnis endgültig aus der lokalen Historie löschen?'))return;
 state.games.splice(i,1);save();history();toast('Spiel aus der Historie gelöscht');
}
function clearHistory(){
 if(!state.games.length)return toast('Die Historie ist bereits leer');
 if(!confirm('Wirklich ALLE '+state.games.length+' Spielergebnisse aus der lokalen Historie löschen? Das kann nicht rückgängig gemacht werden.'))return;
 state.games=[];save();history();toast('Lokale Historie gelöscht');
}
function stats(){let games=state.games;let teamMap={};games.forEach(g=>g.teams.forEach(t=>{let k=t.name;let s=teamMap[k]||(teamMap[k]={games:0,wins:0,points:0,best:0});s.games++;s.points+=t.score;s.best=Math.max(s.best,t.bestBreak||0);if((g.winners||[]).includes(k))s.wins++}));let items=Object.entries(teamMap).sort((a,b)=>b[1].wins-a[1].wins);html(`<h1>Statistiken</h1><div class="grid2"><div class="card"><div class="statsnum">${games.length}</div><div class="muted">Gespielte Partien</div></div><div class="card"><div class="statsnum">${items.length}</div><div class="muted">Verschiedene Teams</div></div></div><div class="card"><h2>Team-Rangliste</h2>${items.length?items.map(([name,s],i)=>`<div class="history"><div><b>${i+1}. ${esc(name)}</b><div class="muted">${s.games} Spiele · ${s.points} Punkte · bestes Break ${s.best}</div></div><span class="winner">${s.wins} Siege</span></div>`).join(''):'<p class="muted">Nach dem ersten abgeschlossenen Spiel erscheinen hier Statistiken.</p>'}</div>`)}function rules(){html(`<h1>Regeln & Tischaufbau</h1><div class="card"><h2><span class="snooker-seven" aria-label="Schwarze Snookerkugel, 7 Punkte"></span> Snooker-Mini-Spiel</h2>

<p class="muted">Tippe oder ziehe auf dem Tisch, um die Richtung festzulegen. <b>Halte deinen Finger auf der gewünschten Zielkugel und bewege ihn bei Bedarf.</b> Schon beim Anvisieren erscheinen die Fluglinien. Die gelbe gestrichelte Linie zeigt den Stoß der weißen Kugel. Die Zielhilfe erkennt Kugeln auch dann, wenn dein Finger nicht genau auf der Kugel liegt, und zeigt die türkisfarbene Fluglinie vor dem Stoß. Eine <b>türkis leuchtende Linie mit Pfeil</b> zeigt, in welche Richtung diese Kugel voraussichtlich rollt (bis zur ersten Bande). <b>Halte den Finger gedrückt, um auszuholen, und lasse los, um zu stoßen.</b></p>
<div class="practice-wrap"><canvas id="practice-canvas" width="420" height="720" aria-label="Interaktives Snooker-Mini-Spiel"></canvas></div>
<div class="practice-info" id="practice-status" role="status">🎯 Zielen: Tisch berühren und halten · Loslassen: Stoßen</div>
<div class="practice-meter" aria-label="Stoßkraft"><i id="practice-power"></i></div>
<div class="practice-controls"><button class="btn alt" type="button" onclick="resetPractice()"><span class="snooker-seven" aria-label="Schwarze Snookerkugel, 7 Punkte"></span> Tisch abräumen / neu aufstellen</button><button class="btn alt" type="button" onclick="resetCueBall()">⚪ Weiß neu setzen</button></div>
<p class="muted">Übungsmodus mit vereinfachter Kugelphysik. Er ist kein vollständiger Snooker-Simulator: Effet, Reibung, Banden- und Kugelkollisionen sind näherungsweise berechnet.</p></div><div class="card"><h2>Farbwerte</h2><div class="grid2">${colors.map(([name,n,c])=>`<div class="row"><span class="sphere" style="width:28px;height:28px;background:${c}"></span><span>${name}: <b>${n}</b></span></div>`).join('')}</div></div><div class="card"><h2>Kurzregeln</h2><p class="muted">Im klassischen Snooker wird zunächst abwechselnd eine rote Kugel (1 Punkt) und eine beliebige Farbe (2–7 Punkte) gespielt. Solange rote Kugeln vorhanden sind, kommen versenkte Farben wieder auf ihre Markierung. Nach der letzten Roten darf noch eine Farbe nach Wahl gespielt werden; erst danach werden Gelb, Grün, Braun, Blau, Pink und Schwarz in dieser Reihenfolge endgültig versenkt.</p><p class="muted">Bei Fouls erhält der Gegner je nach Situation mindestens 4 und höchstens 7 Punkte. Der Sieger eines Frames ist die Seite mit den meisten Punkten nach dem Ende des Frames. Bei Gleichstand wird im offiziellen Spiel die schwarze Kugel erneut aufgesetzt.</p><div class="notice">Hinweis: Die Abbildung zeigt die richtige Reihenfolge und relative Anordnung der Spots; die Kugelabstände sind für kleine Handybildschirme vereinfacht. Beide Spielarten verwenden die automatische Kugelreihenfolge. Die Hausregel „Schwarz vorzeitig“ beendet ein Spiel sofort. Fouls und Sonderfälle werden nicht vollständig automatisch geprüft.</div></div>`);initPractice()}function ballInfo(c){const info={'#ffffff':'Weiß: Spielball. Beim Anstoß innerhalb des D frei platzieren.','#ffdf00':'Gelb: 2 Punkte. Auf der Baulk-Linie links (vom Anstoßende gesehen).','#00c54a':'Grün: 3 Punkte. Auf der Baulk-Linie rechts (vom Anstoßende gesehen).','#b77a38':'Braun: 4 Punkte. Mittelpunkt der Baulk-Linie.','#006dff':'Blau: 5 Punkte. Exakt in der Tischmitte.','#ff67b5':'Pink: 6 Punkte. Auf dem Pink-Spot unmittelbar vor der Spitze des roten Dreiecks in Richtung Tischmitte.','#151515':'Schwarz: 7 Punkte. Black-Spot zwischen rotem Dreieck und oberer kurzen Bande.','#ff172b':'Rot: 1 Punkt pro Kugel. 15 Kugeln bilden ein enges Dreieck; die Spitze zeigt Richtung Pink.'};toast(info[c]||'Snookerkugel')}function download(name,blob){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}function backup(){download('SNOOKER-Backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({app:'SNOOKER',version:1,exported:new Date().toISOString(),...state},null,2)],{type:'application/json'}))}async function importBackup(el){let f=el.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.games)||!('active' in data))throw Error('Ungültige Datei');if(!confirm('Bestehende Historie und laufendes Spiel durch das Backup ersetzen?'))return;state={games:data.games,active:data.active,playerPool:Array.isArray(data.playerPool)?data.playerPool:[]};state.playerPool=state.playerPool.filter(n=>!exampleNames.has(cleanName(n).toLocaleLowerCase('de')));save();go('home');toast('Backup importiert')}catch(e){toast('Import fehlgeschlagen: ungültiges Backup')}finally{el.value=''}}function csv(){let rows=[['Spielbeginn','Spielende','Spielart','Team','Spieler','Punkte','Gewonnen','Bestes Break']];state.games.forEach(g=>g.teams.forEach(t=>rows.push([g.started||'',g.ended||'',g.mode==='classic'?'Klassisch':'Freizeit',t.name,t.players,t.score,(g.winners||[]).includes(t.name)?'Ja':'Nein',t.bestBreak||0])));let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');download('SNOOKER-Ergebnisse.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}))}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeTeamDialog();closeCheers()}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));nav();render();
</script><script src="./minigame.js"></script>
